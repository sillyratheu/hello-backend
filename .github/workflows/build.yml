name: Briefcase Android APK Builder

on:
  repository_dispatch:
    types: [build-apk]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Builder Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies & Java
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip

      - name: Install Briefcase
        run: |
          pip install --upgrade pip
          pip install briefcase

      - name: Clone User Repository & Compile with Briefcase
        run: |
          USER_REPO="${{ github.event.client_payload.repo_url }}"
          APP_NAME="${{ github.event.client_payload.app_name }}"
          
          echo "Cloning user repository: $USER_REPO"
          git clone "$USER_REPO" user_project
          cd user_project
          
          # Create clean pyproject.toml with PEP 639 license definition if missing
          if [ ! -f "pyproject.toml" ]; then
              echo "pyproject.toml not found, generating standard config..."
              cat << 'EOF' > pyproject.toml
          [tool.briefcase]
          project_name = "Shahajjo App"
          bundle = "org.shahajjo"
          version = "0.1.0"
          app_name = "myapp"
          author = "Shahajjo"
          author_email = "support@shahajjo.com"
          license = { text = "MIT" }

          [tool.briefcase.app.myapp]
          formal_name = "Shahajjo App"
          description = "Cloud compiled app via Shahajjo"
          sources = ['main.py']
          sources_requires = []
          platforms = [
              "android"
          ]
          EOF
          fi
          
          # Build Android APK using briefcase
          briefcase create android --no-input
          briefcase build android --no-input

      - name: Upload APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-app-apk
          path: user_project/build/*/android/gradle/app/build/outputs/apk/debug/*.apk
