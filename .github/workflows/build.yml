name: Real Android APK Builder

on:
  repository_dispatch:
    types: [build-apk]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Builder Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libffi-dev libssl-dev

      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Clone User Repository & Compile APK
        run: |
          USER_REPO="${{ github.event.client_payload.repo_url }}"
          APP_NAME="${{ github.event.client_payload.app_name }}"
          
          echo "Cloning user repository: $USER_REPO"
          git clone "$USER_REPO" user_project
          cd user_project
          
          if [ ! -f "buildozer.spec" ]; then
              echo "buildozer.spec not found, initializing default..."
              buildozer init
              sed -i "s/# title = My Application/title = $APP_NAME/g" buildozer.spec
              sed -i "s/# package.name = myapp/package.name = myapp/g" buildozer.spec
              sed -i "s/# package.domain = org.example/package.domain = org.shahajjo/g" buildozer.spec
          fi
          
          # Python script to robustly ensure SDK license is accepted in buildozer.spec
          python3 -c "
          with open('buildozer.spec', 'r') as f:
              lines = f.readlines()
          
          new_lines = []
          license_found = False
          for line in lines:
              if 'android.accept_sdk_license' in line:
                  new_lines.string = 'android.accept_sdk_license = True\n'
                  new_lines.append('android.accept_sdk_license = True\n')
                  license_found = True
              else:
                  new_lines.append(line)
          
          if not license_found:
              new_lines.append('\nandroid.accept_sdk_license = True\n')
              
          with open('buildozer.spec', 'w') as f:
              f.writelines(new_lines)
          print('Successfully forced android.accept_sdk_license = True')
          "
          
          # Run buildozer compilation
          buildozer -v android debug

      - name: Upload and Overwrite Latest APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "Shahajjo Cloud Compiled APK"
          files: user_project/bin/*.apk
          overwrite: true
          body: "Auto-compiled APK generated via Shahajjo platform."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}