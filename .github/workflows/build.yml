name: Docker Buildozer APK Builder

on:
  repository_dispatch:
    types: [build-apk]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Builder Repo
        uses: actions/checkout@v4

      - name: Clone User Repository & Compile via Docker Buildozer
        run: |
          USER_REPO="https://github.com/plainhub/plain-app.git"
          APP_NAME="Ramim"
          
          echo "Cloning user repository: $USER_REPO"
          git clone "$USER_REPO" user_project
          cd user_project
          
          if [ ! -f "buildozer.spec" ]; then
              echo "buildozer.spec not found, initializing default..."
              pip install buildozer
              buildozer init
              sed -i "s/# title = My Application/title = $APP_NAME/g" buildozer.spec
              sed -i "s/# package.name = ramimapp/package.name = ramimapp/g" buildozer.spec
              sed -i "s/# package.domain = org.example/package.domain = org.shahajjo/g" buildozer.spec
          else
              sed -i "s/title = .*/title = $APP_NAME/g" buildozer.spec
          fi
          
          echo "android.accept_sdk_license = True" >> buildozer.spec
          cd ..

          sudo chmod -R 777 user_project

          docker run --rm \
            -e BUILDOZER_ALLOW_INSTALL=1 \
            -v "$(pwd)/user_project:/home/user/hostproject" \
            kivy/buildozer:latest \
            bash -c "cd /home/user/hostproject && buildozer -v android debug"

      - name: Upload APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-app-apk
          path: user_project/bin/*.apk
