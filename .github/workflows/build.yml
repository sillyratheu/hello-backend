name: Real APK Compiler with Buildozer

on:
  repository_dispatch:
    types: [build-apk]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Builder Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies for Buildozer
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libffi-dev libssl-dev

      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Clone User Repository & Build APK
        run: |
          USER_REPO="${{ github.event.client_payload.repo_url }}"
          APP_NAME="${{ github.event.client_payload.app_name }}"
          
          echo "Cloning user repository from: $USER_REPO"
          git clone "$USER_REPO" user_project
          cd user_project
          
          # Jodi user-er repo-te buildozer.spec na thake, tahole default ekta init kore nibe
          if [ ! -f "buildozer.spec" ]; then
              echo "buildozer.spec not found, initializing default..."
              buildozer init
          fi
          
          # Compile Python code to Native Android APK
          echo "Starting Buildozer android debug compilation..."
          buildozer -v android debug

      - name: Upload Real APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "Real APK - ${{ github.event.client_payload.app_name }}"
          files: user_project/bin/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
