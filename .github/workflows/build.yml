name: Real Android APK Builder

on:
  repository_dispatch:
    types: [build-apk]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Builder Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libffi-dev libssl-dev

      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Clone User Repository & Compile APK
        run: |
          USER_REPO="${{ github.event.client_payload.repo_url }}"
          APP_NAME="${{ github.event.client_payload.app_name }}"
          
          echo "Cloning user repository: $USER_REPO"
          git clone "$USER_REPO" user_project
          cd user_project
          
          if [ ! -f "buildozer.spec" ]; then
              echo "buildozer.spec not found, initializing default..."
              buildozer init
              sed -i "s/# title = My Application/title = $APP_NAME/g" buildozer.spec
              sed -i "s/# package.name = myapp/package.name = myapp/g" buildozer.spec
              sed -i "s/# package.domain = org.example/package.domain = org.shahajjo/g" buildozer.spec
          fi
          
          # Automatically accept Android SDK licenses inside buildozer.spec
          sed -i "s/#android.accept_sdk_license = False/android.accept_sdk_license = True/g" buildozer.spec
          sed -i "s/android.accept_sdk_license = False/android.accept_sdk_license = True/g" buildozer.spec

          # Run buildozer normally without 'yes |' to prevent Broken pipe errors
          buildozer -v android debug

      - name: Upload APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-app-apk
          path: user_project/bin/*.apk
