<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Editor — Shahajjo Studio</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
  
  <style>
    body, html { height: 100%; overflow: hidden; margin: 0; padding: 0; background: #0a0a0a; color: #fff; font-family: sans-serif; }
    
    /* Topbar Layout for Mobile */
    .topbar {
      display: flex;
      flex-direction: column;
      background: #000;
      border-bottom: 1px solid #333;
      padding: 10px;
    }
    
    .topbar-row1 {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    
    .brand { font-weight: bold; letter-spacing: 2px; color: #888; font-size: 14px; }
    .repo-name { font-size: 12px; color: #4ade80; font-weight: bold; }
    
    .topbar-row2 {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .topbar-row2 button {
      flex: 1;
      background: transparent;
      border: 1px solid #fff;
      color: #fff;
      padding: 8px 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      transition: 0.2s;
      border-radius: 4px;
    }
    
    .topbar-row2 button:hover, .topbar-row2 button.active {
      background: #fff;
      color: #000;
    }
    
    #btn-edit.active { background: #facc15; color: #000; border-color: #facc15; }
    
    .status-badge {
      font-size: 12px;
      color: #60a5fa;
      text-align: center;
      margin-top: 8px;
      font-weight: bold;
      min-height: 16px;
    }

    /* Main Container */
    .main-container {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 110px); /* Adjust based on topbar height */
    }
    
    .editor-wrapper {
      flex: 1;
      border-bottom: 2px solid #333;
      position: relative;
    }

    /* Lock Overlay */
    #editor-lock-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4);
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 20px;
      display: none; /* Hidden by default */
    }
    
    #editor-lock-overlay span {
      background: #333;
      color: #fff;
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 12px;
      border: 1px solid #555;
    }

    #editor { width: 100%; height: 100%; }

    /* Output Console */
    .output-wrapper {
      height: 35vh;
      background: #050505;
      display: flex;
      flex-direction: column;
      border-top: 1px solid #222;
    }
    
    .output-header {
      background: #111;
      padding: 8px 15px;
      font-size: 12px;
      color: #888;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #222;
    }
    
    .output-header button {
      background: none; border: none; color: #888; cursor: pointer;
      font-size: 12px;
    }
    .output-header button:hover { color: #fff; }

    #output {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      color: #ccc;
      font-family: 'Courier New', Courier, monospace;
      font-size: 12px;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .success-text { color: #4ade80; font-weight: bold; }
    .error-text { color: #f87171; font-weight: bold; }
    .info-text { color: #60a5fa; }
    
    .download-btn {
      display: inline-block;
      background: #fff;
      color: #000;
      padding: 10px 20px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 10px;
      border-radius: 4px;
      text-transform: uppercase;
      transition: 0.2s;
      text-align: center;
      width: 100%;
      box-sizing: border-box;
    }
    .download-btn:hover { background: #ccc; }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <div class="topbar">
    <div class="topbar-row1">
      <div class="brand">SHAHAJJO STUDIO</div>
      <div class="repo-name">{{ repo }}</div>
    </div>
    
    <div class="topbar-row2">
      <button id="btn-edit" onclick="toggleEdit()">Edit</button>
      <button onclick="saveFile()">Save</button>
      <button onclick="buildApp()">Build APK</button>
      <button onclick="checkStatus()">Status</button>
      <button onclick="location.href='/select'">Projects</button>
    </div>
    
    <div id="status" class="status-badge">Ready (Read-Only)</div>
  </div>

  <!-- Main Editor & Output Area -->
  <div class="main-container">
    <!-- Code Editor -->
    <div class="editor-wrapper">
      <div id="editor"></div>
      <div id="editor-lock-overlay">
        <span>🔒 Read-Only Mode. Click 'Edit' to modify.</span>
      </div>
    </div>

    <!-- Output Console -->
    <div class="output-wrapper">
      <div class="output-header">
        <span>CONSOLE OUTPUT</span>
        <button onclick="document.getElementById('output').innerHTML = ''">Clear</button>
      </div>
      <div id="output">> System initialized. Click 'Build APK' to start.</div>
    </div>
  </div>

  <script>
    const REPO = "{{ repo }}";
    let editor;
    let isEditable = false; // ডিফল্টভাবে লক থাকবে

    // Load Monaco Editor
    require.config({ paths: { vs: "https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs" } });
    require(["vs/editor/editor.main"], async () => {
      // Fetch existing code
      let codeContent = "";
      try {
        const res = await fetch(`/api/file?repo=${encodeURIComponent(REPO)}&path=lib/main.dart`);
        const data = await res.json();
        codeContent = data.content;
      } catch(e) {}

      // If no code found, use default
      if (!codeContent) {
        codeContent = `import 'package:flutter/material.dart';

void main() => runApp(MyApp());

class MyApp extends StatelessWidget {
  @override
  Widget build(BuildContext context) {
    return MaterialApp(
      home: Scaffold(
        appBar: AppBar(title: Text('My App')),
        body: Center(child: Text('Built with Shahajjo Studio')),
      ),
    );
  }
}`;
      }

      // Initialize Editor (Locked by default)
      editor = monaco.editor.create(document.getElementById("editor"), {
        value: codeContent,
        language: "dart",
        theme: "vs-dark",
        automaticLayout: true,
        fontSize: 14,
        minimap: { enabled: false },
        readOnly: true, // 🔒 লক করা আছে
        padding: { top: 15 }
      });

      // Show lock overlay
      document.getElementById("editor-lock-overlay").style.display = "flex";
    });

    // Edit/Unlock Toggle Function
    function toggleEdit() {
      if (!editor) return;
      
      isEditable = !isEditable;
      editor.updateOptions({ readOnly: !isEditable });
      
      const btn = document.getElementById("btn-edit");
      const overlay = document.getElementById("editor-lock-overlay");
      
      if (isEditable) {
        btn.textContent = "Lock";
        btn.classList.add("active");
        overlay.style.display = "none"; // ওভারলে সরিয়ে নিন
        setStatus("Editing Mode (Unlocked)");
      } else {
        btn.textContent = "Edit";
        btn.classList.remove("active");
        overlay.style.display = "flex"; // আবার লক করুন
        setStatus("Read-Only Mode");
      }
    }

    // Helper functions
    function setStatus(msg, isError = false) { 
      const el = document.getElementById("status");
      el.textContent = msg; 
      el.style.color = isError ? "#f87171" : "#60a5fa";
    }

    function log(msg, type = 'normal') {
      const el = document.getElementById("output");
      const div = document.createElement("div");
      
      if (type === 'error') div.className = "error-text";
      else if (type === 'success') div.className = "success-text";
      else if (type === 'info') div.className = "info-text";
      
      div.textContent = `> ${msg}`;
      el.appendChild(div);
      el.scrollTop = el.scrollHeight;
    }

    // Save Code Function
    async function saveFile() {
      if (!isEditable) {
        log("Please click 'Edit' before saving.", 'error');
        return;
      }
      
      setStatus("Saving...");
      log("Attempting to save lib/main.dart...", 'info');
      
      try {
        const res = await fetch("/api/file", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            repo: REPO,
            path: "lib/main.dart",
            content: editor.getValue(),
          }),
        });
        
        const contentType = res.headers.get("content-type");
        if (!contentType || !contentType.includes("application/json")) throw new Error("Server Error");
        
        const data = await res.json();
        
        if (data.status === "saved") {
          setStatus("Saved Successfully");
          log("Code saved successfully to your repository.", 'success');
        } else {
          setStatus("Save Failed", true);
          log(`Save failed: ${data.error || 'Unknown error'}`, 'error');
        }
      } catch (err) {
        setStatus("Network Error", true);
        log(`Fetch error: ${err.message}`, 'error');
      }
    }

    // Build APK Function
    async function buildApp() {
      setStatus("Triggering Build...");
      log("Initiating build process on the server...", 'info');
      
      try {
        const res = await fetch("/api/build", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ repo: REPO }),
        });
        
        const contentType = res.headers.get("content-type");
        if (!contentType || !contentType.includes("application/json")) {
            throw new Error("Server Error (HTML returned). Check Render Logs.");
        }

        const data = await res.json();
        
        if (res.ok && data.status === "building") {
          setStatus("Building...");
          log("Build successfully triggered on GitHub Actions.", 'success');
          log("Please wait a few minutes, then click 'Status'.", 'info');
        } else {
          setStatus("Build Failed", true);
          log(`Error: ${data.error || "Could not trigger build."}`, 'error');
        }
      } catch (err) {
        setStatus("Network Error", true);
        log(`Fetch error: ${err.message}`, 'error');
      }
    }

    // Check Status Function
    async function checkStatus() {
      setStatus("Checking Status...");
      log("Fetching latest build status...", 'info');
      
      try {
        const res = await fetch(`/api/build-status?repo=${encodeURIComponent(REPO)}`);
        
        const contentType = res.headers.get("content-type");
        if (!contentType || !contentType.includes("application/json")) {
            throw new Error("Server Error (HTML returned).");
        }

        const data = await res.json();
        
        if (data.status === "no runs yet") {
          setStatus("No Builds Found");
          log("No builds found yet. Click 'Build APK' first.", 'error');
          return;
        }

        setStatus(`${data.status.toUpperCase()}`);
        
        if (data.conclusion === "success" && data.artifacts && data.artifacts.length > 0) {
          log("Build Successful!", 'success');
          const downloadUrl = data.artifacts[0].url;
          
          const el = document.getElementById("output");
          const btnDiv = document.createElement("div");
          btnDiv.innerHTML = `
            <br>
            <a href="${downloadUrl}" target="_blank" class="download-btn">
              ⬇️ Download APK
            </a>
          `;
          el.appendChild(btnDiv);
          el.scrollTop = el.scrollHeight;
          
        } else if (data.conclusion === "failure") {
          log("Build Failed! Check your code or repo files.", 'error');
        } else {
          log(`Current Status: ${data.status}. GitHub Actions is working...`, 'info');
        }
      } catch (err) {
        setStatus("Error", true);
        log(`Fetch error: ${err.message}`, 'error');
      }
    }
  </script>
</body>
</html>
