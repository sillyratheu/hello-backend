<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shahajjo Studio</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="landing">
    <div class="logo">Shahajjo Studio</div>

    <h1 class="title"><span id="typed"></span><span class="cursor"></span></h1>

    <p class="subtitle">
      Build Android apps straight from your browser. Write code,
      build an APK, and ship — no desktop setup required.
    </p>

    <a class="btn" href="/login?next=select">Get Started</a>
    <a class="btn outline" href="#features" style="margin-left: 8px;">Learn More</a>

    <div class="footer">© Shahajjo Studio — All rights reserved</div>
  </div>

  <script>
    const phrases = [
      "Build Android apps in your browser.",
      "No installation. No setup.",
      "Write code. Build APK. Ship.",
      "Shahajjo Studio — built for everyone."
    ];
    const el = document.getElementById("typed");
    let phraseIdx = 0, charIdx = 0, deleting = false;

    function tick() {
      const current = phrases[phraseIdx];
      if (!deleting) {
        el.textContent = current.slice(0, ++charIdx);
        if (charIdx === current.length) {
          deleting = true;
          setTimeout(tick, 1600);
          return;
        }
      } else {
        el.textContent = current.slice(0, --charIdx);
        if (charIdx === 0) {
          deleting = false;
          phraseIdx = (phraseIdx + 1) % phrases.length;
        }
      }
      setTimeout(tick, deleting ? 40 : 80);
    }
    tick();
  </script>
</body>
</html>
